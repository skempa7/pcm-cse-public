<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:; font-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta charset="utf-8">
<title>Chat CSE · Free Community Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="public.css?v=portal-1">
<script src="public-runtime.js?v=shirt-lower-1"></script>
<link rel="stylesheet" href="style.css?v=portal-1">
<link rel="stylesheet" href="learning.css?v=portal-1">
<link rel="stylesheet" href="experience.css?v=reference-style-1">
<link rel="stylesheet" href="study.css?v=portal-1">
<link rel="stylesheet" href="readability.css?v=portal-1">
<link rel="stylesheet" href="portal.css?v=portal-1">
<link rel="icon" type="image/svg+xml" href="chat-cse-mark.svg?v=portal-1">
<link rel="stylesheet" href="encounter-workspace.css?v=shirt-lower-1">
</head>
<body>
<a class="skip-link" href="#view">Skip to the station</a>
<div id="app">
  <header class="topbar">
    <button class="brand" id="btnBrand" type="button" aria-label="Chat CSE — Home">
      <img class="brand-symbol" src="chat-cse-mark.svg?v=portal-1" alt="" aria-hidden="true"><span class="mark">Chat <span class="brand-light">CSE</span></span>
      <span class="sub" id="brandSub">Your clinical skills workspace</span>
    </button>
    <nav class="workspace-nav" aria-label="Main navigation"><button class="btn ghost sm" data-destination="practice">Practice</button><button class="btn ghost sm" data-destination="learn">Learn</button><button class="btn ghost sm" data-destination="progress">Progress</button></nav>
    <div class="spacer"></div>
    <span id="phaseChip" class="phase-chip hidden"></span>
    <div id="clock" class="clock hidden" role="timer" aria-label="Time remaining in this phase">
      <span class="lbl" id="clockLabel">remaining</span>
      <span class="digits" id="clockDigits">--:--</span>
    </div>
    <button id="themeToggle" class="btn ghost sm" type="button">Evening</button>
    <button id="btnHome" class="btn ghost sm hidden" type="button">Home</button>
  </header>
  <main id="view" tabindex="-1"></main>
</div>
<div id="liveRegion" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="alertRegion" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
<div id="overlayRoot"></div>
<script src="device-voice.js?v=portal-1"></script>
<script src="study.js?v=portal-1"></script>
<script src="portal.js?v=portal-1"></script>
<script src="app.js?v=shirt-lower-1"></script>

<script src="learning.js?v=navy-shirts-1"></script>

<script src="encounter-workspace.js?v=shirt-lower-1"></script>
</body>
</html>
