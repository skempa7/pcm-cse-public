*{box-sizing:border-box}body{margin:0;background:#dce7e3;color:#193c3f;font:14px system-ui,sans-serif}button,select{font:inherit}button{border:1px solid #9fb8b4;background:#fffef7;color:#193c3f;padding:8px 11px;border-radius:8px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#d2e8df;border-color:#39796c}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e5a53c;outline-offset:2px}button:disabled{opacity:.45;cursor:default}#room{position:relative;min-height:340px;height:100vh;overflow:hidden}canvas{width:100%;height:100%;display:block}#load{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#dce7e3;gap:10px}progress{width:240px;accent-color:#2d7463}.top{position:absolute;left:16px;top:14px;background:#fffdf3ec;box-shadow:0 4px 18px #183a3c14;border:1px solid #c6d4ca;border-radius:12px;padding:10px 14px}.top strong{display:block;font-size:17px}.top span{font-size:12px;color:#4e6c6c}.view{position:absolute;right:12px;top:14px;display:flex;gap:5px}.regions{position:absolute;left:14px;bottom:16px;display:flex;gap:5px;max-width:calc(100% - 28px);flex-wrap:wrap}.regions button{background:#fffef4eb;box-shadow:0 2px 5px #15363e14}#status.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}#drawer{position:absolute;right:14px;top:64px;width:300px;max-width:calc(100% - 28px);max-height:calc(100% - 122px);overflow:auto;background:#fffef6f5;border:1px solid #acbfba;border-radius:12px;padding:14px;box-shadow:0 8px 28px #18373825}#drawer[hidden]{display:none}h2{margin:0 0 10px;font-size:17px}#maneuver{width:100%;padding:8px;background:white;border:1px solid #9fb8b4;border-radius:6px}#components{display:grid;gap:8px;margin:13px 0}#components label{display:flex;align-items:center;gap:8px}#components input{accent-color:#286c5d;width:17px;height:17px}#perform{background:#205e53;color:white;width:100%;border-color:#205e53}#technique{font-size:12px;line-height:1.45;color:#4d6665;margin:9px 0}.close{float:right;padding:3px 8px}.small{font-size:11px;color:#52706c} @media(max-width:600px){.top{max-width:50%;}.view button{font-size:11px;padding:6px}.regions button{font-size:11px;padding:6px}#drawer{width:270px}}
#anatomyView{position:absolute;top:83px;left:16px;max-width:calc(100% - 32px);padding:7px 10px;border-radius:9px;background:#fffdf3ed;font-size:11px;color:#3a5550}#anatomyView[hidden]{display:none}#anatomyView button{padding:4px 8px;margin-left:8px;font-size:11px}

/* Compact visual controls; labels remain available to assistive technology. */
.view button,#anatomyView button{width:36px!important;height:36px!important;min-width:36px;padding:8px!important;border-radius:50%!important;display:inline-grid;place-items:center;font-size:0!important;margin:0!important}
.view svg,#anatomyView svg{width:20px;height:20px}.view{pointer-events:none}.view button{pointer-events:auto}.camera-presets,.camera-options{gap:6px!important}
#anatomyView{top:62px!important;left:14px!important;padding:0!important;background:transparent!important;border:0!important}#anatomyLabel{display:none!important}
canvas{cursor:grab;touch-action:auto}canvas:active{cursor:grabbing}.at-door canvas{cursor:default}#drawer{display:none!important}
</style>

<nav class="view" aria-label="Patient camera"><div class="camera-presets"><button data-view="face" aria-pressed="false" aria-label="Face" title="Face"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="10" r="5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></button><button data-view="patient" aria-pressed="false" aria-label="Upper body" title="Upper body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="6" r="3"/><path d="M5 21v-7a7 7 0 0 1 14 0v7M8 15v6m8-6v6"/></svg></button><button data-view="full" aria-pressed="false" aria-label="Full patient" title="Full patient"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4" r="2"/><path d="M9 22v-8L7 9h10l-2 5v8M12 14v8M7 9l-3 6m13-6 3 6"/></svg></button><button id="resetView" aria-label="Reset view" title="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 9M3 4v6h6"/></svg></button></div><div class="camera-options"><button data-camera="closer" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6M6 10h8m-4-4v8"/></svg></button><button data-camera="farther" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6M6 10h8"/></svg></button><button id="motion" aria-pressed="false" aria-label="Reduce patient animation" title="Reduce patient animation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button></div></nav>

<span id="status" class="sr-only" role="status" aria-live="polite">Use the Examine tab to perform examinations and Record to review findings.</span>
<script>
'use strict';let instance=null,state={},catalog=[],pending=null,selectedRegion='',localCovered=false;try{localCovered=localStorage.getItem('pcm-room-covered')==='true';}catch{}const motionQuery=matchMedia('(prefers-reduced-motion: reduce)');const $=id=>document.getElementById(id);const origin=location.origin;
function send(data){window.parent.postMessage({...data,renderer:'babylon'},origin)}
function status(text){$('status').textContent=text}
window.pcmCameraAdjusting=()=>{};
window.pcmPositionTransition=progress=>{const overlay=$('positionTransition');const opacity=progress===null?0:Math.sin(Math.PI*Math.max(0,Math.min(1,progress)))**.5;overlay.style.opacity=String(opacity);};
window.pcmCameraPreset=preset=>{document.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===preset)));};
$('resetView').onclick=()=>instance?.SendMessage('EncounterBridge','SetView','patient');
document.querySelectorAll('[data-camera]').forEach(button=>button.onclick=()=>instance?.SendMessage('EncounterBridge','MoveCamera',button.dataset.camera));
window.pcmTrialStatus=({status,message})=>{const box=$('trialStatus');box.textContent=message;if(['error','failed'].includes(status)){const retry=document.createElement('button');retry.textContent='Retry detailed patient';retry.style.marginLeft='10px';retry.onclick=()=>instance?.SendMessage('EncounterBridge','ReloadTrial','');box.append(retry);}box.hidden=!['loading','error','failed','limited'].includes(status)||state.visualDemo!=='humgen-trial';};
window.pcmPatientStatus=({status,message})=>{const box=$('trialStatus');box.textContent=message;if(['error','failed'].includes(status)){const retry=document.createElement('button');retry.textContent='Retry patient';retry.style.marginLeft='10px';retry.onclick=()=>instance?.SendMessage('EncounterBridge','ReloadPatient','');box.append(retry);}box.hidden=!['loading','error','failed','limited'].includes(status)||state.appearance?.model!=='mpfb-young-woman';};
function apply(){if(state.visualDemo!=='humgen-trial'&&state.appearance?.model!=='mpfb-young-woman')$('trialStatus').hidden=true;const anatomyView=!state.comparePrevious&&state.appearance?.model==='mpfb-young-woman'&&state.appearance?.outfit==='unclothed';$('anatomyView').hidden=!anatomyView||state.phase!=='encounter';$('anatomyLabel').textContent=localCovered?'Covered appearance · visual option':'Unclothed anatomy · custom view';$('coverageView').setAttribute('aria-label',localCovered?'Show anatomical view':'Show clothes');$('coverageView').setAttribute('aria-pressed',String(localCovered));$('coverageView').title=localCovered?'Show anatomical view':'Show clothes';const effectiveAppearance=anatomyView&&localCovered?{...state.appearance,outfit:'fitted-casual'}:state.appearance;const effectiveReduced=!!state.reducedMotion||motionQuery.matches;$('motion').setAttribute('aria-pressed',effectiveReduced);$('motion').setAttribute('aria-label',effectiveReduced?'Reduced motion on':'Reduce patient animation');$('motion').disabled=motionQuery.matches;$('motion').title=motionQuery.matches?'System reduced motion is enabled':effectiveReduced?'Resume patient animation':'Reduce patient animation';$('canvas').setAttribute('aria-label',state.phase==='briefing'?'Closed examination-room door. Use Enter encounter in the main doorway panel.':'Patient room. Drag to rotate around the patient. Use zoom buttons and camera presets. Perform examinations in the Examine tab. Scrolling and browser zoom remain available.');document.body.classList.toggle('at-door',state.phase==='briefing');document.body.classList.toggle('in-encounter',state.phase==='encounter');if(instance&&window.pcmUnitySceneReady)instance.SendMessage('EncounterBridge','ApplyState',JSON.stringify({...state,appearance:effectiveAppearance,reducedMotion:effectiveReduced}));$('name').textContent=state.patientName||'Patient room';$('phase').textContent=state.phase==='encounter'?'Encounter in progress':state.phase==='briefing'?'Ready outside the room':state.phase?state.phase.replace(/_/g,' '):'Connecting to your encounter…';document.querySelectorAll('[data-view],#resetView,#adjustView,[data-camera]').forEach(button=>button.disabled=state.phase!=='encounter');const disabled=state.phase!=='encounter'||!state.sessionId||!!pending||state.busyMs>0;document.querySelectorAll('[data-region],#perform').forEach(b=>b.disabled=disabled);window.pcmTechniqueState?.();}
function request(action){if(state.phase!=='encounter'||!state.sessionId||pending||state.busyMs>0)return;pending={type:'pcm-unity-action',requestId:crypto.randomUUID(),sessionId:state.sessionId,...action};send(pending);status('Waiting for encounter confirmation…');apply();const waitingId=pending.requestId;setTimeout(()=>{if(pending&&pending.requestId===waitingId){status('No confirmation yet. The action has not been repeated. Reconnect or use the main encounter controls.');}},9000);}
window.pcmUnityReady=()=>{send({type:'pcm-unity-ready'});apply()};
window.pcmUnityEmit=evt=>{if(evt.action==='select_region'){openRegion(evt.region);send(evt);}else request(evt)};
window.addEventListener('message',event=>{if(event.source!==window.parent||event.origin!==origin)return;const d=event.data||{};if(d.type==='pcm-room-reset-entry'&&state.phase==='briefing'&&instance){instance.SendMessage('EncounterBridge','ResetEntry','');return;}if(d.type==='pcm-room-enter'&&state.phase==='briefing'&&instance&&(!d.sessionId||d.sessionId===state.sessionId)){instance.SendMessage('EncounterBridge','EnterRoom',JSON.stringify({requestId:d.requestId,skip:!!d.skip}));return;}if(d.type==='pcm-unity-state'){const previous=state,incoming=d.state||{};if(incoming.sessionId===state.sessionId&&Number(incoming.eventSeq)<Number(state.eventSeq))return;state=incoming;if(Array.isArray(state.examCatalog))catalog=state.examCatalog;if(previous.sessionId&&previous.sessionId!==state.sessionId){pending=null;localCovered=false;selectedRegion='';$('drawer').hidden=true;status('Use the Examine tab to perform examinations and Record to review findings.');document.querySelectorAll('[data-region]').forEach(button=>button.setAttribute('aria-pressed','false'));}apply();}if(d.type==='pcm-unity-ack'&&pending&&d.requestId===pending.requestId){const p=pending;pending=null;if(d.ok){status('Action recorded in your encounter. Findings appear in the encounter record.');if(instance&&p.action==='exam')instance.SendMessage('EncounterBridge','ShowExam',JSON.stringify({region:selectedRegion,maneuver_id:p.maneuver_id,components:p.components,duration:3}));$('drawer').hidden=true;if(instance&&p.action==='courtesy')instance.SendMessage('EncounterBridge','Acknowledge',JSON.stringify({action:p.action}));}else status(d.error||'Action was not recorded. Please try the main encounter controls.');apply();}});
function openRegion(region){return;selectedRegion=region;$('drawer').hidden=false;$('region-title').textContent=region==='HEENT'?'Head & neck':region;let regions=region==='HEENT'?['HEENT','Neck']:region==='MSK'?['MSK','Musculoskeletal','Extremities','Back']:region==='Neurologic'?['Neurologic','Neuro']: [region];let list=catalog.filter(m=>regions.includes(m.region));$('maneuver').replaceChildren(...list.map(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.label;return o}));showComponents();if(instance)instance.SendMessage('EncounterBridge','FocusRegion',region);document.querySelectorAll('[data-region]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.region===region));}
function showComponents(){const m=catalog.find(m=>m.id===$('maneuver').value);$('components').replaceChildren(...(m?.components||[]).map(c=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=c;label.append(input,document.createTextNode(({cervical_suitability:'Confirm cervical and positional-test suitability',right:'Right side',left:'Left side',head_rotation:'Head rotation',neck_extension:'Supported neck extension'})[c] || c.replace(/_/g,' ')));return label}));$('technique').textContent=m?(m.components.length?'Select each component you intend to perform. ':'')+'This records stated technique; hands-on proficiency cannot be verified virtually.':'Use the main examination drawer for this region.';}
document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{openRegion(b.dataset.region);send({type:'pcm-unity-action',requestId:crypto.randomUUID(),sessionId:state.sessionId,action:'select_region',region:b.dataset.region})});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>instance?.SendMessage('EncounterBridge','SetView',b.dataset.view));$('maneuver').onchange=showComponents;$('close').onclick=()=>{$('drawer').hidden=true};$('perform').onclick=()=>{const m=catalog.find(m=>m.id===$('maneuver').value);if(!m)return;const components=[...document.querySelectorAll('#components input:checked')].map(i=>i.value);if(m.components.length&&!components.length){status('Choose at least one examination component.');return;}request({action:'exam',region:selectedRegion,maneuver_id:m.id,components})};motionQuery.addEventListener('change',()=>apply());$('motion').onclick=()=>{const reducedMotion=!state.reducedMotion;send({type:'pcm-motion-preference',sessionId:state.sessionId,reducedMotion});state={...state,reducedMotion};apply()};
$('coverageView').onclick=()=>{localCovered=!localCovered;try{localStorage.setItem('pcm-room-covered',String(localCovered));}catch{}apply()};
fetch('catalog.json').then(r=>r.json()).then(c=>{if(!catalog.length)catalog=c});apply();
window.pcmBabylonReady=adapter=>{instance=adapter;window.pcmUnitySceneReady=true;$('load').style.display='none';apply();window.pcmUnityReady()};
